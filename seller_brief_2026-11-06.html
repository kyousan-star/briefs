const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.salt),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},k,b(D.ct));
  return new TextDecoder().decode(pt);
}
function show(h){document.open();document.write(h);document.close();}
const KEY="rp_pw";
(async()=>{let s=null;try{s=localStorage.getItem(KEY)}catch(e){}
  if(s){try{show(await open_(s));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}})();
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();
  const pw=document.getElementById("p").value.trim();
  try{const h=await open_(pw);
    if(document.getElementById("r").checked){try{localStorage.setItem(KEY,pw)}catch(e){}}
    show(h);}catch(e){document.getElementById("e").textContent="密码不对";}};
</script></body></html>
